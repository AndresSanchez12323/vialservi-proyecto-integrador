<!doctype html>
<html lang="es" data-tema="oscuro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f59e0b'/%3E%3Ctext x='32' y='45' font-family='Arial,sans-serif' font-size='36' font-weight='bold' text-anchor='middle' fill='%230b1220'%3EV%3C/text%3E%3C/svg%3E" />
    <title>VialServi</title>
    <!--
      El tema se aplica ANTES de pintar y antes de cargar React. Si se hiciera
      al montar la aplicacion, quien tenga el tema claro veria un destello
      oscuro de un par de fotogramas en cada carga. Es la unica razon por la
      que hay codigo aqui y no en comun/tema.ts, que es su sitio.
    -->
    <script>
      (function () {
        try {
          var guardado = localStorage.getItem('vialservi.tema');
          var tema =
            guardado === 'claro' || guardado === 'oscuro'
              ? guardado
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'oscuro'
                : 'claro';
          document.documentElement.dataset.tema = tema;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', tema === 'claro' ? '#f6f7fb' : '#0b1220');
        } catch (e) {
          /* Sin almacenamiento ni matchMedia queda el oscuro del atributo. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
